[package]
name = "sreda-kanban"
version = "0.3.0"
license = "GPL-3.0-or-later"
description = "Local Kanban board"
repository = "https://github.com/ZAREZOV2/sreda"
edition = "2021"
rust-version = "1.90"

[lib]
name = "sreda_kanban_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "sreda-kanban"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "sreda-mcp"
path = "src/mcp_main.rs"

[features]
default = ["desktop", "custom-protocol"]
desktop = ["dep:tauri", "dep:rfd", "dep:tauri-build", "dep:notify-rust"]
custom-protocol = ["desktop", "tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
rfd = { version = "0.18", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["limit"] }
futures-util = "0.3"
tokio-tungstenite = "0.26"
rand = "0.8"
subtle = "2"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
ngrok = "0.16"
http = "1"
url = "2"
comrak = "0.31"
sha2 = "0.10"
hex = "0.4"
schemars = "1"
rmcp = { version = "3.10", default-features = false, features = ["base64", "server", "macros", "transport-io", "transport-streamable-http-server"] }
notify-rust = { version = "4", optional = true }

[dev-dependencies]
rmcp = { version = "3.10", default-features = false, features = ["client", "transport-async-rw"] }
