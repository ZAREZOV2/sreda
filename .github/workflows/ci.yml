name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Системные библиотеки Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config build-essential libdbus-1-dev
      - name: Тесты интерфейса и сборка dist
        working-directory: app
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build
      - name: Тесты и проверка Rust
        run: |
          cargo test --manifest-path app/src-tauri/Cargo.toml
          cargo check --manifest-path app/src-tauri/Cargo.toml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Зависимости и сборка интерфейса
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Бинарник MCP
        run: |
          cargo build --release --bin sreda-mcp --manifest-path app/src-tauri/Cargo.toml
          New-Item -ItemType Directory -Force -Path app/src-tauri/binaries | Out-Null
          Copy-Item app/src-tauri/target/release/sreda-mcp.exe app/src-tauri/binaries/sreda-mcp-x86_64-pc-windows-msvc.exe
      - name: Подключить sidecar к установщику
        run: node -e "const fs=require('fs'); const p='app/src-tauri/tauri.conf.json'; const cfg=JSON.parse(fs.readFileSync(p,'utf8')); cfg.bundle.externalBin=['binaries/sreda-mcp']; fs.writeFileSync(p, JSON.stringify(cfg,null,2));"
      - name: Установщик NSIS
        working-directory: app
        run: npm run installer
      - name: Релиз
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/sreda-mcp.exe
          generate_release_notes: true
